[workspace]
resolver = "3"
members = [
    "crates/lovpn-config",
    "crates/lovpn-keys",
    "crates/lovpn-firewall",
    "crates/lovpn-server",
    "crates/lovpn-cli",
]

[workspace.package]
version = "0.1.0-dev.1"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[workspace.dependencies]
base64 = "=0.22.1"
clap = { version = "=4.6.7", features = ["derive"] }
ipnet = { version = "=2.12.2", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = { version = "=1.1.6", default-features = false, features = ["std", "serde", "parse"] }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
rustix = { version = "=1.1.5", features = ["fs", "process", "net"] }
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = "=1.9.0"
getrandom = "=0.3.4"
tempfile = "=3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
