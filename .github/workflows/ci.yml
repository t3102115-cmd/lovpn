name: foundation-checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - if: runner.os == 'Linux'
        run: cargo test --locked --workspace
      # The five lovpn-win store tests need a process whose new directories are owned by
      # Administrators/SYSTEM (an elevated service). A hosted runner's user creates user-owned
      # directories, which the store correctly refuses. They run on the Windows VM gate.
      - if: runner.os == 'Windows'
        run: >-
          cargo test --locked --workspace -- --skip nrpt_intent_roundtrips_durably
          --skip private_dir_is_locked_to_system --skip profile_import_enforces_the_server_key
          --skip scoped_profile_import_preserves --skip service_held_identity_flow
      - run: cargo build --locked --release --workspace
      - if: runner.os == 'Linux'
        run: python3 scripts/check-docs.py
      - if: runner.os == 'Linux'
        name: Disposable kernel WireGuard and nftables test
        run: |
          sudo apt-get update
          sudo apt-get install --yes wireguard-tools nftables iproute2
          # Ubuntu 24.04 restricts unprivileged user namespaces; allow them for this job only.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Unprivileged, like local runs: namespaces only, never host rules.
          ./scripts/test-networking.sh
      - if: runner.os == 'Linux'
        name: Installer staging smoke test
        run: ./scripts/test-install.sh

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: cargo install --locked cargo-audit --version 0.22.2
      - run: cargo audit --deny warnings
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo deny --locked check

  window:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Browser test tooling (test-only, never shipped)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install playwright==1.63.0
          .venv/bin/playwright install --with-deps chromium-headless-shell firefox
          npm install --prefix .axe axe-core@4.14.0
      - run: scripts/test-ui.sh
      - run: LOVPN_BROWSER=firefox scripts/test-ui.sh

  reproducible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Two builds, same hashes
        run: ./scripts/repro-check.sh
      - name: SBOM
        run: ./scripts/sbom.py -o sbom-linux.json


  windows-reproducible:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Two builds, same hashes
        run: ./scripts/repro-check.ps1

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz each target for 60 s
        run: ./scripts/fuzz.sh 60
