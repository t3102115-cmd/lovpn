[package]
name = "lovpn-tray"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "LoVPN tray icon and notifications: StatusNotifierItem on Linux, the notification area on Windows."

[[bin]]
name = "lovpn-tray"
path = "src/main.rs"

[dependencies]
lovpn-cli = { path = "../lovpn-cli", version = "=0.1.0-dev.1" }
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.6", default-features = false, features = ["async-io", "blocking"] }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
